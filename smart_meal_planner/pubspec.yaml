name: smart_meal_planner
description: A Flutter-based Smart Meal Planner & Nutrition Tracking App

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  hive: ^2.0.0
  hive_flutter: ^1.0.0
  http: ^0.13.0
  charts_flutter: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/ # Add your asset images here if any
    - assets/icons/   # Add your asset icons here if any