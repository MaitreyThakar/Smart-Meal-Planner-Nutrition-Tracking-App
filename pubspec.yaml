name: smart_meal_planner
description: "Smart Meal Planner & Nutrition Tracking App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.69.0

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_slidable: ^3.1.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
